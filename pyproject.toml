[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuprofile-unlocker"
version = "0.2.6"
description = "Generate eight Fujifilm-look DCP profiles from a locally installed Adobe Standard profile."
requires-python = ">=3.11"
dependencies = ["tkinterdnd2==0.6.3"]
license = { file = "LICENSE" }

[project.gui-scripts]
fuprofile-unlocker = "fuprofile_unlocker.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
